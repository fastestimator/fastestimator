[project]
name = "fastestimator"
version = "2.0.0"
description = "Deep learning framework"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "FastEstimator Dev" }]
requires-python = ">=3.10"
keywords = ["fastestimator", "pytorch", "deep-learning", "machine-learning"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "albumentations==1.4.1",
    "matplotlib==3.9.2",
    "h5py==3.11.0",
    "scipy",
    "PyLaTeX==1.4.1",
    "natsort==8.3.1",
    "transformers==4.38.2",
    "torchinfo==1.7.2",
    "graphviz==0.20.1",
    "torchview==0.2.6",
    "pydot==1.4.2",
    "dot2tex==2.11.3",
    "gdown==4.6.4",
    "PySocks==1.7.1",
    "uncertainty-calibration==0.1.4",
    "dill==0.3.6",
    "scikit-image==0.21.0",
    "prettytable==3.6.0",
    "nltk==3.8.1",
    "requests==2.32.2",
    "tqdm==4.66.5",
    "numpy==1.26.4",
    "pyfiglet==1.0.4",
    "opencv-python==4.7.0.72",
    "pandas==2.0.1",
    "wget==3.2",
    "pillow==10.4.0",
    "jsonpickle==3.0.1",
    "python-docx==0.8.11",
    "plotly==5.13.1",
    "kaleido==0.2.1",
    "orjson==3.8.7",
    "scikit-learn==1.3.2",
    "lazy_loader==0.2",
    "fe_pycocotools==1.0",
    "typing_extensions==4.12.2",
    "charset-normalizer==3.3.2",
    "py-cpuinfo==9.0.0",
    "fastparquet==2024.2.0",
    "jax==0.4.33",
    "jaxlib==0.4.33",
    # PyTorch - macOS gets standard build (with MPS), others get CPU build by default
    "torch==2.3.1 ; sys_platform == 'darwin'",
    "torchvision==0.18.1 ; sys_platform == 'darwin'",
    "torchaudio==2.3.1 ; sys_platform == 'darwin'",
    "torch==2.3.1+cpu ; sys_platform != 'darwin'",
    "torchvision==0.18.1+cpu ; sys_platform != 'darwin'",
    "torchaudio==2.3.1+cpu ; sys_platform != 'darwin'",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest",
    "coverage",
    "pre-commit",
    "isort",
    "yapf",
]
# Jupyter notebook support
jupyter = [
    "jupyter==1.1.1",
    "ipython==8.18.1",
    "ipykernel==6.27.1",
    "ipywidgets==8.1.1",
    "notebook",
]

[project.scripts]
fastestimator = "fastestimator.cli.main:main"

[project.urls]
Homepage = "https://www.fastestimator.org"
Repository = "https://github.com/fastestimator/fastestimator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastestimator"]

# UV configuration
[tool.uv]
default-groups = []
# Only resolve for the current platform to avoid cross-platform conflicts
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]

# PyTorch package indexes
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
# macOS uses default PyPI (includes MPS support), Linux/Windows CPU uses pytorch-cpu index
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

# Code formatting configuration
[tool.yapf]
based_on_style = "pep8"
column_limit = 120
dedent_closing_brackets = true
coalesce_brackets = true
split_before_logical_operator = true
split_complex_comprehension = true
blank_lines_around_top_level_definition = 2
blank_line_before_nested_class_or_def = false
blank_line_before_class_docstring = false
indent_dictionary_value = false
space_between_ending_comma_and_closing_bracket = false
split_before_closing_bracket = true
split_before_first_argument = false
split_before_arithmetic_operator = true

[tool.isort]
line_length = 120
multi_line_output = 2
